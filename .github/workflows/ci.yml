name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Compile source and tests
        run: python -m compileall src tests
      - name: Run public runtime, organizer, lifecycle, product, brain, and entrypoint tests
        run: python -m pytest -q tests/test_public_runtime.py tests/test_organizer.py tests/test_skills_lifecycle.py tests/test_product_packs.py tests/test_brain_adapter.py tests/test_entrypoint_errors.py
      - name: Run ordinary-user file organizer demo
        run: forge-agent demo --kind file-organizer --json
      - name: Run real organizer dry-run smoke test
        run: |
          mkdir -p /tmp/forge-agent-ci-invoices
          cat > /tmp/forge-agent-ci-invoices/invoice-2026-06-ci.txt <<'EOF'
          Invoice Date: 2026-06-05
          Amount: 19.00
          EOF
          forge-agent organize /tmp/forge-agent-ci-invoices --json
          test -f /tmp/forge-agent-ci-invoices/invoice-2026-06-ci.txt
      - name: Run real organizer approve and rollback smoke test
        run: |
          mkdir -p /tmp/forge-agent-ci-rollback
          cat > /tmp/forge-agent-ci-rollback/receipt-2026-09-ci.txt <<'EOF'
          Receipt Date: 2026-09-09
          Amount: 29.00
          EOF
          forge-agent --workspace /tmp/forge-agent-ci-rollback-workspace organize /tmp/forge-agent-ci-rollback --approve --json
          test -f /tmp/forge-agent-ci-rollback/organized/2026-09/receipt-2026-09-ci.txt
          forge-agent --workspace /tmp/forge-agent-ci-rollback-workspace organize-rollback --json
          test -f /tmp/forge-agent-ci-rollback/receipt-2026-09-ci.txt
      - name: Run skill lifecycle smoke test
        run: |
          forge-agent --workspace /tmp/forge-agent-ci-skill do "organize receipts by month" >/tmp/forge-agent-ci-skill-task.json
          forge-agent --workspace /tmp/forge-agent-ci-skill skills list
          SKILL_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          lines = Path('/tmp/forge-agent-ci-skill/skills/index.jsonl').read_text(encoding='utf-8').splitlines()
          print(json.loads(lines[0])['skill_id'])
          PY
          )
          forge-agent --workspace /tmp/forge-agent-ci-skill skills validate "$SKILL_ID" --reason "ci validation"
          forge-agent --workspace /tmp/forge-agent-ci-skill skills show "$SKILL_ID" | grep validated
      - name: Run v1.4-v1.8 product smoke tests
        run: |
          forge-agent --workspace /tmp/forge-agent-ci-product make ppt "Forge Agent MVP" --json
          forge-agent --workspace /tmp/forge-agent-ci-product make report "Forge Agent Validation" --json
          forge-agent --workspace /tmp/forge-agent-ci-product make news "AI agents" --json
          forge-agent --workspace /tmp/forge-agent-ci-product make storyboard "Forge Agent demo" --json
          forge-agent --workspace /tmp/forge-agent-ci-product schedule add "every day 9am" forge-agent organize ~/Downloads --json
          forge-agent --workspace /tmp/forge-agent-ci-product schedule list --json
          test -f /tmp/forge-agent-ci-product/artifacts/index.jsonl
          test -f /tmp/forge-agent-ci-product/schedules.jsonl
      - name: Run v1.9 brain adapter smoke test
        run: forge-agent ask "organize my receipts" --json
      - name: Verify demo evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('.forge-agent/demo-file-organizer/manifest.json')
          assert manifest.exists(), 'demo manifest was not created'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          assert data['created_skill'] is True
          assert data['reuse_proven'] is True
          assert len(data['moved_files']) == 5
          assert Path('.forge-agent/demo-file-organizer/approvals.jsonl').exists()
          assert Path('.forge-agent/demo-file-organizer/skills/index.jsonl').exists()
          PY
