name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Compile source and tests
        run: python -m compileall src tests
      - name: Run public runtime, organizer, lifecycle, product, brain, memory, and entrypoint tests
        run: python -m pytest -q tests/test_public_runtime.py tests/test_organizer.py tests/test_organizer_skipped_json.py tests/test_rollback_evidence.py tests/test_cli_json_errors.py tests/test_cli_json_consistency.py tests/test_cli_skills_json_errors.py tests/test_cli_approvals_json_errors.py tests/test_cli_error_envelope.py tests/test_memory_store.py tests/test_cli_memory.py tests/test_skills_lifecycle.py tests/test_product_packs.py tests/test_brain_adapter.py tests/test_entrypoint_errors.py tests/test_entrypoint_workspace.py tests/test_entrypoint_ask_validation.py
      - name: Run ordinary-user file organizer demo
        run: forge-agent demo --kind file-organizer --json
      - name: Run real organizer dry-run smoke test
        run: |
          mkdir -p /tmp/forge-agent-ci-invoices
          cat > /tmp/forge-agent-ci-invoices/invoice-2026-06-ci.txt <<'EOF'
          Invoice Date: 2026-06-05
          Amount: 19.00
          EOF
          forge-agent organize /tmp/forge-agent-ci-invoices --json
          test -f /tmp/forge-agent-ci-invoices/invoice-2026-06-ci.txt
      - name: Run real organizer approve and rollback smoke test
        run: |
          mkdir -p /tmp/forge-agent-ci-rollback
          cat > /tmp/forge-agent-ci-rollback/receipt-2026-09-ci.txt <<'EOF'
          Receipt Date: 2026-09-09
          Amount: 29.00
          EOF
          forge-agent --workspace /tmp/forge-agent-ci-rollback-workspace organize /tmp/forge-agent-ci-rollback --approve --json
          test -f /tmp/forge-agent-ci-rollback/organized/2026-09/receipt-2026-09-ci.txt
          forge-agent --workspace /tmp/forge-agent-ci-rollback-workspace organize-rollback --json
          test -f /tmp/forge-agent-ci-rollback/receipt-2026-09-ci.txt
      - name: Run skill lifecycle smoke test
        run: |
          forge-agent --workspace /tmp/forge-agent-ci-skill do "organize receipts by month" >/tmp/forge-agent-ci-skill-task.json
          forge-agent --workspace /tmp/forge-agent-ci-skill skills list
          SKILL_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          lines = Path('/tmp/forge-agent-ci-skill/skills/index.jsonl').read_text(encoding='utf-8').splitlines()
          print(json.loads(lines[0])['skill_id'])
          PY
          )
          forge-agent --workspace /tmp/forge-agent-ci-skill skills validate "$SKILL_ID" --reason "ci validation"
          forge-agent --workspace /tmp/forge-agent-ci-skill skills show "$SKILL_ID" | grep validated
      - name: Run v1.4-v1.8 product smoke tests
        run: |
          forge-agent --workspace /tmp/forge-agent-ci-product make ppt "Forge Agent MVP" --json
          forge-agent --workspace /tmp/forge-agent-ci-product make report "Forge Agent Validation" --json
          forge-agent --workspace /tmp/forge-agent-ci-product make news "AI agents" --json
          forge-agent --workspace /tmp/forge-agent-ci-product make storyboard "Forge Agent demo" --json
          forge-agent --workspace /tmp/forge-agent-ci-product schedule add "every day 9am" forge-agent organize ~/Downloads --json
          forge-agent --workspace /tmp/forge-agent-ci-product schedule list --json
          test -f /tmp/forge-agent-ci-product/artifacts/index.jsonl
          test -f /tmp/forge-agent-ci-product/schedules.jsonl
      - name: Run v1.9 brain adapter smoke test
        run: forge-agent ask "organize my receipts" --json
      - name: Run v2.0 ask workspace smoke test
        run: forge-agent --workspace /tmp/forge-agent-ci-ask ask "organize my receipts" --json
      - name: Run v2.0 ask validation smoke tests
        run: |
          forge-agent ask --help
          ! forge-agent ask --json
      - name: Run v2.5 memory palace smoke test
        run: |
          forge-agent --workspace /tmp/forge-agent-ci-memory memory add "remember that Forge memory must be visible" --json
          forge-agent --workspace /tmp/forge-agent-ci-memory memory list --json
          forge-agent --workspace /tmp/forge-agent-ci-memory memory search visible --json
          forge-agent --workspace /tmp/forge-agent-ci-memory memory recall visible --json
          forge-agent --workspace /tmp/forge-agent-ci-memory memory doctor --json
          test -f /tmp/forge-agent-ci-memory/memory/index.jsonl
          test -f /tmp/forge-agent-ci-memory/memory/audit.jsonl
          test -f /tmp/forge-agent-ci-memory/memory/palace.json
      - name: Run v2.5 memory governance smoke test
        run: |
          MEMORY_ID=$(forge-agent --workspace /tmp/forge-agent-ci-memory-governance memory add "sensitive memory governance check" --safety sensitive --json | python -c "import json,sys; print(json.load(sys.stdin)['memory']['id'])")
          forge-agent --workspace /tmp/forge-agent-ci-memory-governance memory quarantine "$MEMORY_ID" --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-governance memory restore "$MEMORY_ID" --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-governance memory export --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-governance memory doctor --json
      - name: Run v2.5 memory recall smoke test
        run: |
          forge-agent --workspace /tmp/forge-agent-ci-memory-recall memory add "approval is required before invoice organization" --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-recall memory add "sensitive invoice secret" --safety sensitive --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-recall memory recall invoice approval --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-recall memory recall invoice secret --include-sensitive --json
      - name: Run v2.6 memory-aware ask smoke test
        run: |
          forge-agent --workspace /tmp/forge-agent-ci-memory-ask memory add "invoices should be organized by month only after preview" --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-ask memory add "sensitive invoice secret should not be injected" --safety sensitive --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-ask ask "organize invoices by month" --json > /tmp/forge-agent-ci-memory-ask-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/forge-agent-ci-memory-ask-plan.json').read_text(encoding='utf-8'))
          memory_used = data['metadata']['memory_used']
          assert len(memory_used) == 1
          assert memory_used[0]['score'] > 0
          assert data['metadata']['memory_policy']['enabled'] is True
          assert data['metadata']['memory_policy']['include_sensitive'] is False
          PY
      - name: Run v2.6 ask memory control smoke test
        run: |
          forge-agent --workspace /tmp/forge-agent-ci-memory-controls memory add "invoices should be organized by month only after preview" --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-controls memory add "invoices need explicit approval before movement" --json
          forge-agent --workspace /tmp/forge-agent-ci-memory-controls ask --memory-limit 1 "organize invoices by month" --json > /tmp/forge-agent-ci-memory-controls-limit.json
          forge-agent --workspace /tmp/forge-agent-ci-memory-controls ask --no-memory "organize invoices by month" --json > /tmp/forge-agent-ci-memory-controls-off.json
          python - <<'PY'
          import json
          from pathlib import Path
          limited = json.loads(Path('/tmp/forge-agent-ci-memory-controls-limit.json').read_text(encoding='utf-8'))
          disabled = json.loads(Path('/tmp/forge-agent-ci-memory-controls-off.json').read_text(encoding='utf-8'))
          assert len(limited['metadata']['memory_used']) == 1
          assert limited['metadata']['memory_policy']['limit'] == 1
          assert disabled['metadata']['memory_used'] == []
          assert disabled['metadata']['memory_policy']['enabled'] is False
          PY
      - name: Run v2.6 sensitive memory opt-in smoke test
        run: |
          forge-agent --workspace /tmp/forge-agent-ci-sensitive-ask memory add "invoice organization public rule" --json
          forge-agent --workspace /tmp/forge-agent-ci-sensitive-ask memory add "sensitive invoice secret" --safety sensitive --json
          forge-agent --workspace /tmp/forge-agent-ci-sensitive-ask ask "invoice secret" --json > /tmp/forge-agent-ci-sensitive-default.json
          forge-agent --workspace /tmp/forge-agent-ci-sensitive-ask ask --include-sensitive-memory "invoice secret" --json > /tmp/forge-agent-ci-sensitive-opt-in.json
          python - <<'PY'
          import json
          from pathlib import Path
          default = json.loads(Path('/tmp/forge-agent-ci-sensitive-default.json').read_text(encoding='utf-8'))
          opt_in = json.loads(Path('/tmp/forge-agent-ci-sensitive-opt-in.json').read_text(encoding='utf-8'))
          assert default['metadata']['memory_policy']['include_sensitive'] is False
          assert all(item['safety'] == 'normal' for item in default['metadata']['memory_used'])
          assert opt_in['metadata']['memory_policy']['include_sensitive'] is True
          assert any(item['safety'] == 'sensitive' for item in opt_in['metadata']['memory_used'])
          PY
      - name: Verify demo evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('.forge-agent/demo-file-organizer/manifest.json')
          assert manifest.exists(), 'demo manifest was not created'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          assert data['created_skill'] is True
          assert data['reuse_proven'] is True
          assert len(data['moved_files']) == 5
          assert Path('.forge-agent/demo-file-organizer/approvals.jsonl').exists()
          assert Path('.forge-agent/demo-file-organizer/skills/index.jsonl').exists()
          PY
